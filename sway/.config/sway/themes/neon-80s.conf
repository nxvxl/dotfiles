# 80s NEON / SYNTHWAVE THEME

set $theme_bg       #0d0221
set $theme_panel    #1a0b2e
set $theme_text     #d1f7ff
set $theme_accent   #b026ff
set $theme_danger   #ff2a6d
set $theme_inactive #45454f

# Client colors:  border       background    text         indicator    child_border
client.focused          $theme_accent $theme_panel $theme_text $theme_accent $theme_accent
client.focused_inactive $theme_inactive $theme_panel $theme_text $theme_inactive $theme_inactive
client.unfocused        $theme_inactive $theme_panel $theme_text $theme_inactive $theme_inactive
client.urgent           $theme_danger $theme_panel $theme_text $theme_danger $theme_danger
client.placeholder      $theme_inactive $theme_bg $theme_text $theme_inactive $theme_inactive
client.background       $theme_bg

default_border pixel 2
gaps inner 5
gaps outer 10
smart_gaps on
