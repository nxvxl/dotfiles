# WARM PAPER THEME - clean, modern, minimalist

[global]
    frame_color      = "#d8dade"
    background       = "#f7f7f5"
    foreground       = "#1c1d21"
    separator_color  = frame
    frame_width      = 2
    corner_radius    = 8
    gap_size         = 8
    padding          = 12
    horizontal_padding = 12
    font             = JetBrains Mono 10

[urgency_low]
    frame_color = "#d8dade"
    background  = "#f7f7f5"
    foreground  = "#7a7f8a"

[urgency_normal]
    frame_color = "#3b6ef5"
    background  = "#f7f7f5"
    foreground  = "#1c1d21"

[urgency_critical]
    frame_color = "#c4554d"
    background  = "#f7f7f5"
    foreground  = "#1c1d21"
