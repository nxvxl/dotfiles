# 80s NEON / SYNTHWAVE THEME

[global]
    frame_color      = "#b026ff"
    background       = "#0d0221"
    foreground       = "#d1f7ff"
    separator_color  = frame
    frame_width      = 3
    corner_radius    = 8
    gap_size         = 10
    padding          = 8
    horizontal_padding = 8
    font             = JetBrains Mono 10

[urgency_low]
    frame_color = "#6c5b8a"
    background  = "#0d0221"
    foreground  = "#d1f7ff"

[urgency_normal]
    frame_color = "#b026ff"
    background  = "#0d0221"
    foreground  = "#d1f7ff"

[urgency_critical]
    frame_color = "#ff2a6d"
    background  = "#0d0221"
    foreground  = "#d1f7ff"
