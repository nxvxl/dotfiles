config_version = 15

[bar.default]
capsule = true
center = []
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "clock",
    "control-center",
    "session"
]
margin_ends = 0
position = "bottom"
radius = 0
radius_top_left = 0
radius_top_right = 0
shadow = false

[notification]
position = "bottom_right"

[theme]
builtin = "Catppuccin"
community_palette = "Breeze"
source = "community"
wallpaper_scheme = "m3-fruit-salad"

[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "sway" ]
community_ids = [ "neovim", "rofi" ]

[wallpaper.default]
path = "/home/noval/Pictures/wallpaper.jpg"

[wallpaper.last]
path = "/home/noval/Pictures/wallpaper.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/noval/Pictures/wallpaper.jpg"

[widget.clock]
format = "{:%b %d, %H:%M}"

[widget.taskbar]
capsule = false

[idle]
behavior_order = ["lock", "screen-off", "suspend"]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 600
action = "lock"

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"       # turns monitors off, and back on when you return

[idle.behavior.suspend]
timeout = 900
action = "lock_and_suspend" # or action = "suspend" with lock_before_suspend = false
